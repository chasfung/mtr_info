<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MTR Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Noto Sans HK', -apple-system, sans-serif;
      padding: 2px 4px;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: 4px; /* 平均分配卡片間距 */
    }

    /* 加粗邊框與字體，針對 E-Ink 螢幕優化 */
    .card {
      border: 2px solid #000000;
      border-radius: 6px;
      background-color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 8px;
      flex: 1; /* 自動填滿高度 */
    }

    .left-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .line-tag {
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .bg-ktl { background-color: #00af41; }
    .bg-eal { background-color: #53b9e6; }
    .bg-tml { background-color: #923011; }

    .dest-title {
      font-size: 15px;
      font-weight: 900;
      color: #000000;
      white-space: nowrap;
    }

    .freq-info {
      font-size: 17px;
      font-weight: 900;
      color: #000000;
      text-align: right;
      white-space: nowrap;
    }

    .sub-text {
      font-size: 10px;
      color: #666666;
      text-align: right;
      font-weight: 900;
      padding-right: 4px;
      margin-top: 2px;
      height: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-ktl">觀塘線</span>
        <span class="dest-title">往 調景嶺</span>
      </div>
      <div class="freq-info" id="ktl-wha-tik">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-eal">東鐵線</span>
        <span class="dest-title">往 金鐘</span>
      </div>
      <div class="freq-info" id="eal-huh-adm">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-eal">東鐵線</span>
        <span class="dest-title">往 上水 / 邊境</span>
      </div>
      <div class="freq-info" id="eal-huh-north">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-tml">屯馬線</span>
        <span class="dest-title">往 屯門</span>
      </div>
      <div class="freq-info" id="tml-huh-tum">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-tml">屯馬線</span>
        <span class="dest-title">往 烏溪沙</span>
      </div>
      <div class="freq-info" id="tml-huh-wks">約 -- 分鐘</div>
    </div>
    <div class="sub-text" id="update-time">更新: --:--</div>
  </div>

  <script>
    // 雙重保險抓取機制：直連失敗自動轉用 AllOrigins 代理
    async function fetchMTR(line, station) {
      const targetUrl = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${station}`;
      
      // 第一階段：嘗試直接連線
      try {
        const res = await fetch(targetUrl, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data.status === 1 && data.data[`${line}-${station}`]) {
            return data.data[`${line}-${station}`];
          }
        }
      } catch (e) {}

      // 第二階段：SenseCraft 伺服器被阻擋時，透過代理伺服器抓取
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        const resProxy = await fetch(proxyUrl, { cache: 'no-store' });
        if (resProxy.ok) {
          const proxyData = await resProxy.json();
          if (proxyData.status === 1 && proxyData.data[`${line}-${station}`]) {
            return proxyData.data[`${line}-${station}`];
          }
        }
      } catch (e) {}
      
      return null;
    }

    function calculateFrequency(trainList) {
      if (!trainList || trainList.length < 2) return null;
      const t1 = parseInt(trainList[0].ttnt);
      const t2 = parseInt(trainList[1].ttnt);
      if (!isNaN(t1) && !isNaN(t2)) {
        const diff = Math.abs(t2 - t1);
        if (diff > 0) return `約 ${diff} 分鐘`;
      }
      return null;
    }

    async function updateAllSchedules() {
      // 強制寫入香港時間 (UTC+8)
      const now = new Date();
      const hkTimeMs = now.getTime() + (8 * 3600000);
      const hkDate = new Date(hkTimeMs);
      const h = String(hkDate.getUTCHours()).padStart(2, '0');
      const m = String(hkDate.getUTCMinutes()).padStart(2, '0');
      document.getElementById('update-time').innerText = `更新: ${h}:${m}`;

      try {
        const [ktlWha, ealHuh, tmlHuh] = await Promise.all([
          fetchMTR('KTL', 'WHA'),
          fetchMTR('EAL', 'HUH'),
          fetchMTR('TML', 'HUH')
        ]);

        if (ktlWha && ktlWha.UP) {
          const res = calculateFrequency(ktlWha.UP);
          if (res) document.getElementById('ktl-wha-tik').innerText = res;
        }

        if (ealHuh) {
          if (ealHuh.DOWN) {
            const res = calculateFrequency(ealHuh.DOWN);
            if (res) document.getElementById('eal-huh-adm').innerText = res;
          }
          if (ealHuh.UP) {
            const res = calculateFrequency(ealHuh.UP);
            if (res) document.getElementById('eal-huh-north').innerText = res;
          }
        }

        if (tmlHuh) {
          if (tmlHuh.UP) {
            const res = calculateFrequency(tmlHuh.UP);
            if (res) document.getElementById('tml-huh-tum').innerText = res;
          }
          if (tmlHuh.DOWN) {
            const res = calculateFrequency(tmlHuh.DOWN);
            if (res) document.getElementById('tml-huh-wks').innerText = res;
          }
        }
      } catch (err) {}
    }

    updateAllSchedules();
  </script>
</body>
</html>
