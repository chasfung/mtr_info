<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MTR Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Noto Sans HK', -apple-system, sans-serif;
      padding: 2px 4px;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 2px;
    }

    .card {
      border: 2px solid #000000;
      border-radius: 4px;
      background-color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px; 
      flex: 1;
      min-height: 0;
    }

    .left-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .line-tag {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .bg-ktl { background-color: #00af41; }
    .bg-eal { background-color: #53b9e6; }
    .bg-tml { background-color: #923011; }

    .dest-title {
      font-size: 14px;
      font-weight: 900;
      color: #000000;
      white-space: nowrap;
    }

    .freq-info {
      font-size: 15px;
      font-weight: 900;
      color: #000000;
      text-align: right;
      white-space: nowrap;
    }

    .sub-text {
      font-size: 9px;
      color: #666666;
      text-align: right;
      font-weight: 900;
      padding-right: 4px;
      margin-top: 2px;
      height: 12px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-ktl">觀塘線</span>
        <span class="dest-title">往 調景嶺</span>
      </div>
      <div class="freq-info" id="ktl-wha-tik">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-eal">東鐵線</span>
        <span class="dest-title">往 金鐘</span>
      </div>
      <div class="freq-info" id="eal-huh-adm">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-eal">東鐵線</span>
        <span class="dest-title">往 上水 / 邊境</span>
      </div>
      <div class="freq-info" id="eal-huh-north">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-tml">屯馬線</span>
        <span class="dest-title">往 屯門</span>
      </div>
      <div class="freq-info" id="tml-huh-tum">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-tml">屯馬線</span>
        <span class="dest-title">往 烏溪沙</span>
      </div>
      <div class="freq-info" id="tml-huh-wks">約 -- 分鐘</div>
    </div>
    <div class="sub-text" id="update-time">更新: --:--</div>
  </div>

  <script>
    async function fetchMTR(line, station) {
      // 移除干擾參數，還原官方乾淨網址
      const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${station}`;
      
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data.status === 1 && data.data[`${line}-${station}`]) {
            return data.data[`${line}-${station}`];
          }
        }
      } catch (e) {}

      // 升級版代理：使用 /get 解析 JSON，避免被 SenseCraft 攔截
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const resProxy = await fetch(proxyUrl, { cache: 'no-store' });
        if (resProxy.ok) {
          const wrapper = await resProxy.json();
          const proxyData = JSON.parse(wrapper.contents);
          if (proxyData.status === 1 && proxyData.data[`${line}-${station}`]) {
            return proxyData.data[`${line}-${station}`];
          }
        }
      } catch (e) {}
      
      return null;
    }

    function calculateFrequency(trainList) {
      if (!trainList || trainList.length === 0) return `約 -- 分鐘`;
      if (trainList.length === 1) return `約 ${trainList[0].ttnt} 分鐘`;
      
      const t1 = parseInt(trainList[0].ttnt);
      const t2 = parseInt(trainList[1].ttnt);
      if (!isNaN(t1) && !isNaN(t2)) {
        const diff = Math.abs(t2 - t1);
        if (diff > 0) return `約 ${diff} 分鐘`;
      }
      return `約 ${trainList[0].ttnt} 分鐘`; // 算術失敗時退回顯示下一班車
    }

    async function updateAllSchedules() {
      const now = new Date();
      const hkTimeMs = now.getTime() + (8 * 3600000);
      const hkDate = new Date(hkTimeMs);
      const h = String(hkDate.getUTCHours()).padStart(2, '0');
      const m = String(hkDate.getUTCMinutes()).padStart(2, '0');
      document.getElementById('update-time').innerText = `更新: ${h}:${m}`;

      try {
        const [ktlWha, ealHuh, tmlHuh] = await Promise.all([
          fetchMTR('KTL', 'WHA'),
          fetchMTR('EAL', 'HUH'),
          fetchMTR('TML', 'HUH')
        ]);

        if (ktlWha && ktlWha.UP) document.getElementById('ktl-wha-tik').innerText = calculateFrequency(ktlWha.UP);
        
        if (ealHuh) {
          if (ealHuh.DOWN) document.getElementById('eal-huh-adm').innerText = calculateFrequency(ealHuh.DOWN);
          if (ealHuh.UP) document.getElementById('eal-huh-north').innerText = calculateFrequency(ealHuh.UP);
        }

        if (tmlHuh) {
          if (tmlHuh.UP) document.getElementById('tml-huh-tum').innerText = calculateFrequency(tmlHuh.UP);
          if (tmlHuh.DOWN) document.getElementById('tml-huh-wks').innerText = calculateFrequency(tmlHuh.DOWN);
        }
      } catch (err) {}
    }

    updateAllSchedules();
  </script>
</body>
</html>
