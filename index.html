<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTR Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: 'Noto Sans HK', sans-serif; padding: 2px 4px; }
    .container { display: flex; flex-direction: column; height: 100%; gap: 2px; }
    .card { border: 2px solid #000000; border-radius: 4px; background-color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; flex: 1; min-height: 0; }
    .left-box { display: flex; align-items: center; gap: 6px; }
    .line-tag { font-size: 11px; font-weight: 900; color: #ffffff; padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
    .bg-ktl { background-color: #00af41; } .bg-eal { background-color: #53b9e6; } .bg-tml { background-color: #923011; }
    .dest-title { font-size: 14px; font-weight: 900; color: #000000; white-space: nowrap; }
    .freq-info { font-size: 15px; font-weight: 900; color: #000000; text-align: right; white-space: nowrap; }
    .sub-text { font-size: 9px; color: #666666; text-align: right; font-weight: 900; padding-right: 4px; margin-top: 2px; height: 12px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card"><div class="left-box"><span class="line-tag bg-ktl">觀塘線</span><span class="dest-title">往 調景嶺</span></div><div class="freq-info" id="ktl">約 -- 分鐘</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-eal">東鐵線</span><span class="dest-title">往 金鐘</span></div><div class="freq-info" id="eal-dn">約 -- 分鐘</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-eal">東鐵線</span><span class="dest-title">往 上水 / 邊境</span></div><div class="freq-info" id="eal-up">約 -- 分鐘</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-tml">屯馬線</span><span class="dest-title">往 屯門</span></div><div class="freq-info" id="tml-up">約 -- 分鐘</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-tml">屯馬線</span><span class="dest-title">往 烏溪沙</span></div><div class="freq-info" id="tml-dn">約 -- 分鐘</div></div>
    <div class="sub-text" id="update">更新: --:--</div>
  </div>
  <script>
    async function loadData() {
      try {
        // 加入隨機數確保每次都讀取最新檔案，不被瀏覽器快取
        const res = await fetch('mtr_data.json?t=' + new Date().getTime(), { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          document.getElementById('ktl').innerText = data.ktl_up;
          document.getElementById('eal-dn').innerText = data.eal_dn;
          document.getElementById('eal-up').innerText = data.eal_up;
          document.getElementById('tml-up').innerText = data.tml_up;
          document.getElementById('tml-dn').innerText = data.tml_dn;
          document.getElementById('update').innerText = '更新: ' + data.update_time;
        }
      } catch(e) {}
    }
    loadData();
  </script>
</body>
</html>
