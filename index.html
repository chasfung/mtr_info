<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="-1">
  <title>MTR Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; font-family: 'Noto Sans HK', sans-serif; padding: 2px 4px; }
    .container { display: flex; flex-direction: column; height: 100%; gap: 2px; }
    .card { border: 2px solid #000000; border-radius: 4px; background-color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; flex: 1; min-height: 0; }
    .left-box { display: flex; align-items: center; gap: 6px; }
    .line-tag { font-size: 11px; font-weight: 900; color: #ffffff; padding: 2px 5px; border-radius: 3px; white-space: nowrap; }
    .bg-ktl { background-color: #00af41; } .bg-eal { background-color: #53b9e6; } .bg-tml { background-color: #923011; }
    .dest-title { font-size: 14px; font-weight: 900; color: #000000; white-space: nowrap; }
    .freq-info { font-size: 15px; font-weight: 900; color: #000000; text-align: right; white-space: nowrap; }
    .sub-text { font-size: 9px; color: #666666; text-align: right; font-weight: 900; padding-right: 4px; margin-top: 2px; height: 12px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card"><div class="left-box"><span class="line-tag bg-ktl">觀塘線</span><span class="dest-title">往 調景嶺</span></div><div class="freq-info" id="ktl">載入中...</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-eal">東鐵線</span><span class="dest-title">往 金鐘</span></div><div class="freq-info" id="eal-dn">載入中...</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-eal">東鐵線</span><span class="dest-title">往 上水 / 邊境</span></div><div class="freq-info" id="eal-up">載入中...</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-tml">屯馬線</span><span class="dest-title">往 屯門</span></div><div class="freq-info" id="tml-up">載入中...</div></div>
    <div class="card"><div class="left-box"><span class="line-tag bg-tml">屯馬線</span><span class="dest-title">往 烏溪沙</span></div><div class="freq-info" id="tml-dn">載入中...</div></div>
    <div class="sub-text" id="update">更新: --:--</div>
  </div>
  <script>
    async function loadData() {
      try {
        // 加入雙重隨機參數，逼瀏覽器同 SenseCraft 一定要攞新 File
        const timestamp = new Date().getTime();
        const rand = Math.random().toString(36).substring(7);
        const url = `mtr_data.json?_t=${timestamp}&_r=${rand}`;
        
        // 使用更強制嘅 Fetch 設定
        const res = await fetch(url, { 
          method: 'GET',
          cache: 'no-store', // 強制不快取
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });
        
        if (res.ok) {
          const data = await res.json();
          document.getElementById('ktl').innerText = data.ktl_up || '約 -- 分鐘';
          document.getElementById('eal-dn').innerText = data.eal_dn || '約 -- 分鐘';
          document.getElementById('eal-up').innerText = data.eal_up || '約 -- 分鐘';
          document.getElementById('tml-up').innerText = data.tml_up || '約 -- 分鐘';
          document.getElementById('tml-dn').innerText = data.tml_dn || '約 -- 分鐘';
          document.getElementById('update').innerText = '更新: ' + (data.update_time || '--:--');
        } else {
           document.getElementById('update').innerText = '讀取失敗: HTTP ' + res.status;
        }
      } catch(e) {
          document.getElementById('update').innerText = '系統錯誤: 無法讀取資料';
      }
    }
    
    // 網頁載入即刻執行
    loadData();
    
    // 加多個保險：每 30 秒自動再抓一次，防 SenseCraft 截圖卡住
    setInterval(loadData, 30000);
  </script>
</body>
</html>
