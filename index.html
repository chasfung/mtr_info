<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MTR Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Noto Sans HK', -apple-system, sans-serif;
      padding: 2px 4px;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 2px;
    }

    .card {
      border: 2px solid #000000;
      border-radius: 4px;
      background-color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px; 
      flex: 1;
      min-height: 0;
    }

    .left-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .line-tag {
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .bg-ktl { background-color: #00af41; }
    .bg-eal { background-color: #53b9e6; }
    .bg-tml { background-color: #923011; }

    .dest-title {
      font-size: 14px;
      font-weight: 900;
      color: #000000;
      white-space: nowrap;
    }

    .freq-info {
      font-size: 15px;
      font-weight: 900;
      color: #000000;
      text-align: right;
      white-space: nowrap;
    }

    .sub-text {
      font-size: 9px;
      color: #666666;
      text-align: right;
      font-weight: 900;
      padding-right: 4px;
      margin-top: 2px;
      height: 12px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-ktl">觀塘線</span>
        <span class="dest-title">往 調景嶺</span>
      </div>
      <div class="freq-info" id="ktl-wha-tik">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-eal">東鐵線</span>
        <span class="dest-title">往 金鐘</span>
      </div>
      <div class="freq-info" id="eal-huh-adm">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-eal">東鐵線</span>
        <span class="dest-title">往 上水 / 邊境</span>
      </div>
      <div class="freq-info" id="eal-huh-north">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-tml">屯馬線</span>
        <span class="dest-title">往 屯門</span>
      </div>
      <div class="freq-info" id="tml-huh-tum">約 -- 分鐘</div>
    </div>
    <div class="card">
      <div class="left-box">
        <span class="line-tag bg-tml">屯馬線</span>
        <span class="dest-title">往 烏溪沙</span>
      </div>
      <div class="freq-info" id="tml-huh-wks">約 -- 分鐘</div>
    </div>
    <div class="sub-text" id="update-time">更新: --:--</div>
  </div>

  <script>
    // 建立帶有超時控制的抓取函數，防止在 SenseCraft 伺服器上卡死
    async function fetchWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(id);
        if (res.ok) return await res.json();
      } catch (e) {
        clearTimeout(id);
      }
      return null;
    }

    async function fetchMTR(line, station) {
      const targetUrl = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${station}`;
      let data = null;

      // 1. 第一階段：嘗試直連 (極速限時 1.5 秒，失敗立刻換 Proxy)
      data = await fetchWithTimeout(targetUrl, 1500);
      if (data && data.status === 1 && data.data[`${line}-${station}`]) {
        return data.data[`${line}-${station}`];
      }

      // 2. 第二階段：備援代理 AllOrigins (限時 2 秒)
      const proxy1 = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
      data = await fetchWithTimeout(proxy1, 2000);
      if (data && data.status === 1 && data.data[`${line}-${station}`]) {
        return data.data[`${line}-${station}`];
      }

      // 3. 第三階段：備援代理 CorsProxy (限時 2 秒)
      const proxy2 = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
      data = await fetchWithTimeout(proxy2, 2000);
      if (data && data.status === 1 && data.data[`${line}-${station}`]) {
        return data.data[`${line}-${station}`];
      }

      return null;
    }

    function calculateFrequency(trainList) {
      if (!trainList || trainList.length === 0) return `約 -- 分鐘`;
      if (trainList.length === 1) return `約 ${trainList[0].ttnt} 分鐘`;
      
      const t1 = parseInt(trainList[0].ttnt);
      const t2 = parseInt(trainList[1].ttnt);
      if (!isNaN(t1) && !isNaN(t2)) {
        const diff = Math.abs(t2 - t1);
        if (diff > 0) return `約 ${diff} 分鐘`;
      }
      return `約 ${trainList[0].ttnt} 分鐘`;
    }

    async function updateAllSchedules() {
      // 強制寫入香港時間 (UTC+8)
      const now = new Date();
      const hkTimeMs = now.getTime() + (8 * 3600000);
      const hkDate = new Date(hkTimeMs);
      const h = String(hkDate.getUTCHours()).padStart(2, '0');
      const m = String(hkDate.getUTCMinutes()).padStart(2, '0');
      document.getElementById('update-time').innerText = `更新: ${h}:${m}`;

      try {
        const [ktlWha, ealHuh, tmlHuh] = await Promise.all([
          fetchMTR('KTL', 'WHA'),
          fetchMTR('EAL', 'HUH'),
          fetchMTR('TML', 'HUH')
        ]);

        if (ktlWha && ktlWha.UP) document.getElementById('ktl-wha-tik').innerText = calculateFrequency(ktlWha.UP);
        
        if (ealHuh) {
          if (ealHuh.DOWN) document.getElementById('eal-huh-adm').innerText = calculateFrequency(ealHuh.DOWN);
          if (ealHuh.UP) document.getElementById('eal-huh-north').innerText = calculateFrequency(ealHuh.UP);
        }

        if (tmlHuh) {
          if (tmlHuh.UP) document.getElementById('tml-huh-tum').innerText = calculateFrequency(tmlHuh.UP);
          if (tmlHuh.DOWN) document.getElementById('tml-huh-wks').innerText = calculateFrequency(tmlHuh.DOWN);
        }
      } catch (err) {}
    }

    updateAllSchedules();
  </script>
</body>
</html>
